<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>AZ Printing</title> 

    <link rel="stylesheet" href="testing.css"> 
    <link rel="icon" type="img" href="logo.png"> 

</head> 
<body> 
    <div class="header"> 
        <div class="row"> 
            <div class="logo"> 
                <img src="logo.png" alt="logo"> 
                <div class="logo-name"> 
                    <h1>AZ Printing Shop</h1> 
                    <h4>Where Quality Meets the Page</h4> 
                </div> 
            </div> 
            <div class="nav-bar"> 
                <ul class="nav-barContainer"> 
                    <div class="services"> 
                        <button>Services</button> 
                        <div class="content1"> 
                            <a href="#" id="service-printing">Printing</a> 
                            <a href="#" id="service-photo">Photo Printing</a> 
                            <a href="#" id="service-photocopy">Photo copy</a> 
                            <a href="#" id="service-laminate">Laminate</a> 
                        </div> 
                    </div> 
 
                    <div class="contact"> 
                        <button>Contact</button> 
                        <div class="content2"> 
                            <a href="#"><img src="facebook.png" alt="facebook">Facebook</a> 
                            <a href="#"><img src="instagram.png" alt="instagram">Instagram</a> 
                        </div> 
                    </div> 
 
                    <div class="aboutUs" id="about-btn"> 
                        <button>About Us</button> 
                    </div> 
                </ul> 
            </div> 
        </div> 
    </div> 
 
    <div class="main-container"> 
        <div class="right-side"> 
            <div class="front-text"> 
                <p>Printing Service Website</p> 
            </div> 
            <ul class="quality-list"> 
                <li>Superior Quality Printing</li> 
                <li>Exellent Quality Service</li> 
                <li>Affordable Prices</li> 
            </ul> 

            <input type="file" id="file-upload-input" style="display: none;" multiple accept=".pdf,.doc,.docx,.jpg,.jpeg,.png">
            <button class="btn" id="input-file-btn">INPUT FILE</button> 
        </div> 
    </div>
